<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Kiala Studio - Extractor de Emergencia v3.0</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <script src="https://cdn.jsdelivr.net/npm/marked/marked.min.js"></script>
  <!-- SQL.js para leer bases de datos SQLite directamente en el navegador -->
  <script src="https://cdnjs.cloudflare.com/ajax/libs/sql.js/1.8.0/sql-wasm.js"></script>
  <link href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@400;500&family=Inter:wght@300;400;500;600&display=swap" rel="stylesheet">
  <style>
    body {
      font-family: 'Inter', sans-serif;
      background-color: #050505;
      color: #E2E2E6;
    }
    .mono { font-family: 'JetBrains Mono', monospace; }
    .brand-kiala {
      background: linear-gradient(135deg, #E6DAC8 0%, #C4A77D 50%, #8F7449 100%);
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
    }
    ::-webkit-scrollbar { width: 8px; height: 8px; }
    ::-webkit-scrollbar-track { background: #050505; }
    ::-webkit-scrollbar-thumb { background: #1A1A22; border-radius: 4px; }
    ::-webkit-scrollbar-thumb:hover { background: #C4A77D; }
  </style>
</head>
<body class="h-screen flex flex-col overflow-hidden">

  <!-- HEADER -->
  <header class="h-16 border-b border-[#1A1A22] bg-[#0E0E13] px-6 flex items-center justify-between shrink-0">
    <div class="flex items-center space-x-3">
      <span class="text-2xl">🛡️</span>
      <div class="flex flex-col">
        <span class="font-bold text-sm tracking-wider brand-kiala">KIALA STUDIO</span>
        <span class="text-[10px] font-mono text-neutral-500 uppercase tracking-widest">Extractor de Emergencia de Base de Datos & MD</span>
      </div>
    </div>
    <div class="flex items-center space-x-3">
      <button onclick="loadUltimaRespuestaMD()" class="px-4 py-2 text-xs bg-[#14141A] hover:bg-[#1A1A22] border border-[#22222E] rounded-xl text-neutral-300 transition">
        📄 Leer ultima_respuesta_gemini.md
      </button>
      <button onclick="tryAutoLoadDB()" class="px-4 py-2 text-xs bg-emerald-600/20 hover:bg-emerald-600/30 border border-emerald-500/30 rounded-xl text-emerald-400 transition font-medium">
        ⚡ Auto-Cargar backup_chats.db
      </button>
    </div>
  </header>

  <!-- MAIN CONTENT -->
  <div class="flex-1 flex overflow-hidden">
    
    <!-- PANEL IZQUIERDO: CONTROLES Y TABLAS -->
    <aside class="w-80 border-r border-[#1A1A22] bg-[#0C0C10] p-4 flex flex-col space-y-4 shrink-0 overflow-y-auto">
      
      <!-- CARGA MANUAL DE ARCHIVOS -->
      <div class="p-4 rounded-2xl bg-[#111116] border border-[#1A1A22] space-y-3">
        <h3 class="text-xs font-mono text-neutral-400 uppercase tracking-wider">Carga Manual de Archivos</h3>
        
        <!-- Cargar .db -->
        <div>
          <label class="block text-[10px] text-neutral-500 mb-1">Seleccionar backup_chats.db</label>
          <input type="file" id="db-file-input" accept=".db,.sqlite,.sqlite3" onchange="handleDBFileSelect(event)" class="w-full text-xs text-neutral-400 file:mr-2 file:py-1 file:px-3 file:rounded-lg file:border-0 file:text-xs file:font-bold file:bg-[#C4A77D] file:text-[#0A0A0D] hover:file:bg-[#D4B78D] cursor-pointer">
        </div>

        <!-- Cargar .md -->
        <div class="pt-2 border-t border-[#1A1A22]">
          <label class="block text-[10px] text-neutral-500 mb-1">Seleccionar ultima_respuesta_gemini.md</label>
          <input type="file" id="md-file-input" accept=".md,.txt" onchange="handleMDFileSelect(event)" class="w-full text-xs text-neutral-400 file:mr-2 file:py-1 file:px-3 file:rounded-lg file:border-0 file:text-xs file:font-bold file:bg-neutral-700 file:text-white hover:file:bg-neutral-600 cursor-pointer">
        </div>
      </div>

      <!-- BUSCADOR -->
      <div class="space-y-2">
        <label class="block text-xs font-mono text-neutral-400 uppercase tracking-wider">Buscador Global</label>
        <input type="text" id="search-input" oninput="filterResults()" placeholder="Buscar 'lista', 'funciones'..." class="w-full bg-[#14141A] border border-[#22222E] rounded-xl px-3 py-2 text-sm text-neutral-200 outline-none focus:border-[#C4A77D]/50 transition shadow-inner">
      </div>

      <!-- TABLAS DETECTADAS EN LA DB -->
      <div class="flex-1 flex flex-col space-y-2 overflow-hidden">
        <label class="block text-xs font-mono text-neutral-400 uppercase tracking-wider">Tablas en la DB</label>
        <div id="tables-list" class="flex-1 overflow-y-auto space-y-1 pr-1 text-xs text-neutral-500">
          <div class="p-3 text-center bg-[#111116] rounded-xl border border-[#1A1A22]">Ninguna base de datos cargada</div>
        </div>
      </div>

    </aside>

    <!-- PANEL DERECHO: VISOR DE DATOS -->
    <main class="flex-1 bg-[#050505] flex flex-col overflow-hidden p-6">
      
      <!-- CONSOLA DE ESTADO -->
      <div id="status-banner" class="mb-4 p-3 rounded-xl bg-[#14141A] border border-[#22222E] text-xs text-neutral-400 flex items-center justify-between">
        <span id="status-text">Esperando acción...</span>
        <span id="status-indicator" class="w-2.5 h-2.5 rounded-full bg-neutral-600"></span>
      </div>

      <!-- CONTENEDOR PRINCIPAL DE RESULTADOS -->
      <div class="flex-1 bg-[#0C0C10] border border-[#1A1A22] rounded-2xl overflow-hidden flex flex-col">
        
        <!-- CABECERA DEL VISOR -->
        <div class="h-12 border-b border-[#1A1A22] bg-[#111116] px-4 flex items-center justify-between shrink-0">
          <span id="viewer-title" class="text-xs font-mono text-neutral-400 uppercase tracking-wider">Contenido del Archivo</span>
          <button onclick="copyViewerContent()" class="px-3 py-1 text-[11px] bg-[#1A1A22] hover:bg-[#22222E] border border-[#2A2A38] rounded-lg text-neutral-300 transition flex items-center gap-1">
            📋 Copiar Todo
          </button>
        </div>

        <!-- CUERPO DEL VISOR -->
        <div id="viewer-body" class="flex-1 overflow-y-auto p-6 select-text">
          <div class="h-full flex flex-col items-center justify-center text-center text-neutral-500 space-y-2">
            <span class="text-4xl">🔍</span>
            <p class="text-sm">Usa los botones de arriba para auto-cargar o selecciona un archivo manualmente desde el panel izquierdo.</p>
          </div>
        </div>

      </div>

    </main>

  </div>

  <script>
    let dbInstance = null;
    let loadedData = null; // Guardará el tipo de datos cargados ('db' o 'md')
    let dbTables = [];
    let dbRowsByTable = {};

    // Configurar SQL.js
    let SQL = null;
    initSqlJs({
      locateFile: file => `https://cdnjs.cloudflare.com/ajax/libs/sql.js/1.8.0/${file}`
    }).then(sql => {
      SQL = sql;
      updateStatus("Motor SQL.js cargado correctamente. Listo para procesar bases de datos.", "emerald");
    }).catch(err => {
      updateStatus("Error al cargar SQL.js: " + err.message, "rose");
    });

    function updateStatus(text, color = "neutral") {
      const textEl = document.getElementById('status-text');
      const indEl = document.getElementById('status-indicator');
      if (textEl) textEl.textContent = text;
      
      if (indEl) {
        indEl.className = "w-2.5 h-2.5 rounded-full";
        if (color === "emerald") indEl.classList.add("bg-emerald-500", "shadow-[0_0_8px_rgba(16,185,129,0.6)]");
        else if (color === "rose") indEl.classList.add("bg-rose-500", "shadow-[0_0_8px_rgba(244,63,94,0.6)]");
        else indEl.classList.add("bg-neutral-600");
      }
    }

    // AUTO-CARGA DE BASE DE DATOS
    async function tryAutoLoadDB() {
      if (!SQL) {
        alert("El motor SQL.js aún se está cargando. Espera un segundo.");
        return;
      }
      updateStatus("Intentando auto-cargar backup_chats.db...", "neutral");
      try {
        const res = await fetch('/archivos_guardados/backup_chats.db?t=' + Date.now());
        if (!res.ok) throw new Error("No se pudo obtener el archivo del servidor local.");
        
        const buffer = await res.arrayBuffer();
        processDBBuffer(buffer);
        updateStatus("¡Base de datos backup_chats.db cargada automáticamente con éxito!", "emerald");
      } catch (err) {
        updateStatus("No se pudo auto-cargar la DB: " + err.message + ". Por favor, selecciónala manualmente.", "rose");
      }
    }

    // AUTO-CARGA DE ULTIMA RESPUESTA MD
    async function loadUltimaRespuestaMD() {
      updateStatus("Intentando auto-cargar ultima_respuesta_gemini.md...", "neutral");
      try {
        const res = await fetch('/ultima_respuesta_gemini.md?t=' + Date.now());
        if (!res.ok) throw new Error("No se pudo obtener el archivo del servidor local.");
        
        const text = await res.text();
        displayMD(text, "ultima_respuesta_gemini.md");
        updateStatus("¡Archivo Markdown cargado con éxito!", "emerald");
      } catch (err) {
        updateStatus("No se pudo auto-cargar el MD: " + err.message + ". Por favor, selecciónalo manualmente.", "rose");
      }
    }

    // MANEJO DE ARCHIVOS MANUALES
    function handleDBFileSelect(e) {
      const file = e.target.files[0];
      if (!file) return;
      
      const reader = new FileReader();
      reader.onload = function(evt) {
        try {
          processDBBuffer(evt.target.result);
          updateStatus(`Archivo DB '${file.name}' cargado manualmente con éxito.`, "emerald");
        } catch (err) {
          updateStatus("Error al procesar la DB: " + err.message, "rose");
        }
      };
      reader.readAsArrayBuffer(file);
    }

    function handleMDFileSelect(e) {
      const file = e.target.files[0];
      if (!file) return;
      
      const reader = new FileReader();
      reader.onload = function(evt) {
        displayMD(evt.target.result, file.name);
        updateStatus(`Archivo Markdown '${file.name}' cargado manualmente con éxito.`, "emerald");
      };
      reader.readAsText(file);
    }

    // PROCESAR BUFFER DE BASE DE DATOS
    function processDBBuffer(buffer) {
      dbInstance = new SQL.Database(new Uint8Array(buffer));
      
      // Obtener todas las tablas
      const res = dbInstance.exec("SELECT name FROM sqlite_master WHERE type='table';");
      if (res.length === 0) {
        throw new Error("La base de datos no contiene tablas.");
      }
      
      dbTables = res[0].values.map(row => row[0]);
      dbRowsByTable = {};
      
      // Renderizar lista de tablas
      const listCont = document.getElementById('tables-list');
      listCont.innerHTML = '';
      
      dbTables.forEach(table => {
        // Obtener filas de cada tabla
        try {
          const rowsRes = dbInstance.exec(`SELECT * FROM "${table}"`);
          if (rowsRes.length > 0) {
            const columns = rowsRes[0].columns;
            const values = rowsRes[0].values;
            dbRowsByTable[table] = values.map(valRow => {
              let rowObj = {};
              columns.forEach((col, idx) => {
                rowObj[col] = valRow[idx];
              });
              return rowObj;
            });
          } else {
            dbRowsByTable[table] = [];
          }
        } catch (e) {
          dbRowsByTable[table] = [];
        }

        const btn = document.createElement('button');
        btn.className = "w-full text-left p-2.5 rounded-xl bg-[#111116] hover:bg-[#181822] border border-[#1A1A22] hover:border-[#C4A77D]/30 text-neutral-300 transition flex items-center justify-between";
        btn.innerHTML = `
          <span class="font-mono truncate font-medium">${table}</span>
          <span class="bg-[#1A1A22] px-2 py-0.5 rounded text-[10px] text-neutral-500">${dbRowsByTable[table].length} filas</span>
        `;
        btn.onclick = () => displayTable(table);
        listCont.appendChild(btn);
      });

      loadedData = 'db';
      // Mostrar la primera tabla automáticamente si existe
      if (dbTables.length > 0) {
        displayTable(dbTables[0]);
      }
    }

    // MOSTRAR TABLA EN EL VISOR
    function displayTable(tableName) {
      const titleEl = document.getElementById('viewer-title');
      const bodyEl = document.getElementById('viewer-body');
      
      titleEl.textContent = `Tabla: ${tableName}`;
      bodyEl.innerHTML = '';

      const rows = dbRowsByTable[tableName] || [];
      if (rows.length === 0) {
        bodyEl.innerHTML = '<div class="text-center text-neutral-500 py-10">Esta tabla está vacía.</div>';
        return;
      }

      // Crear contenedor de filas
      const container = document.createElement('div');
      container.className = 'space-y-6';

      rows.forEach((row, idx) => {
        const card = document.createElement('div');
        card.className = 'p-5 rounded-2xl bg-[#111116] border border-[#1A1A22] space-y-3';
        
        // Cabecera de la fila
        const cardHeader = document.createElement('div');
        cardHeader.className = 'flex items-center justify-between border-b border-[#1A1A22] pb-2 text-xs font-mono text-neutral-500';
        cardHeader.innerHTML = `<span>Fila #${idx + 1}</span>`;
        card.appendChild(cardHeader);

        // Campos de la fila
        const fieldsCont = document.createElement('div');
        fieldsCont.className = 'space-y-2';

        Object.entries(row).forEach(([key, val]) => {
          const field = document.createElement('div');
          field.className = 'flex flex-col md:flex-row md:items-start gap-1 md:gap-4 text-sm';
          
          // Si el valor parece texto largo o JSON, lo formateamos bonito
          let valHtml = '';
          const isLongText = typeof val === 'string' && (val.length > 100 || val.includes('\n'));
          
          if (isLongText) {
            valHtml = `<pre class="flex-1 bg-[#0A0A0D] border border-[#1C1C26] p-3 rounded-xl font-mono text-xs text-neutral-300 overflow-x-auto whitespace-pre-wrap select-text">${escapeHtml(val)}</pre>`;
          } else {
            valHtml = `<span class="flex-1 text-neutral-200 font-mono text-xs select-text">${escapeHtml(String(val))}</span>`;
          }

          field.innerHTML = `
            <span class="w-32 shrink-0 font-mono text-xs text-[#C4A77D] font-medium truncate">${key}:</span>
            ${valHtml}
          `;
          fieldsCont.appendChild(field);
        });

        card.appendChild(fieldsCont);
        container.appendChild(card);
      });

      bodyEl.appendChild(container);
    }

    // MOSTRAR MARKDOWN EN EL VISOR
    function displayMD(text, filename) {
      const titleEl = document.getElementById('viewer-title');
      const bodyEl = document.getElementById('viewer-body');
      
      titleEl.textContent = `Archivo: ${filename}`;
      bodyEl.innerHTML = '';

      const mdCont = document.createElement('div');
      mdCont.className = 'prose prose-invert max-w-none text-neutral-200 select-text';
      mdCont.innerHTML = marked.parse(text);
      
      bodyEl.appendChild(mdCont);
      loadedData = 'md';
    }

    // FILTRAR RESULTADOS
    function filterResults() {
      const term = document.getElementById('search-input').value.toLowerCase();
      if (!term) {
        if (loadedData === 'db' && dbTables.length > 0) {
          displayTable(dbTables[0]);
        }
        return;
      }

      const bodyEl = document.getElementById('viewer-body');
      bodyEl.innerHTML = '';

      if (loadedData === 'db') {
        // Buscar en todas las tablas de la DB
        const container = document.createElement('div');
        container.className = 'space-y-6';
        let foundCount = 0;

        Object.entries(dbRowsByTable).forEach(([table, rows]) => {
          rows.forEach((row, idx) => {
            // Comprobar si algún valor contiene el término
            const match = Object.values(row).some(val => String(val).toLowerCase().includes(term));
            if (match) {
              foundCount++;
              const card = document.createElement('div');
              card.className = 'p-5 rounded-2xl bg-[#111116] border border-[#1A1A22] space-y-3';
              
              card.innerHTML = `
                <div class="flex items-center justify-between border-b border-[#1A1A22] pb-2 text-xs font-mono text-neutral-500">
                  <span>Tabla: <strong class="text-[#C4A77D]">${table}</strong> | Fila #${idx + 1}</span>
                </div>
              `;

              const fieldsCont = document.createElement('div');
              fieldsCont.className = 'space-y-2';

              Object.entries(row).forEach(([key, val]) => {
                const isMatch = String(val).toLowerCase().includes(term);
                const highlightClass = isMatch ? 'border-amber-500/30 bg-amber-500/5' : '';
                
                let valHtml = '';
                const isLongText = typeof val === 'string' && (val.length > 100 || val.includes('\n'));
                
                if (isLongText) {
                  valHtml = `<pre class="flex-1 bg-[#0A0A0D] border border-[#1C1C26] p-3 rounded-xl font-mono text-xs text-neutral-300 overflow-x-auto whitespace-pre-wrap select-text ${isMatch ? 'border-amber-500/50 bg-amber-500/10' : ''}">${escapeHtml(val)}</pre>`;
                } else {
                  valHtml = `<span class="flex-1 text-neutral-200 font-mono text-xs select-text ${isMatch ? 'text-amber-400 font-bold' : ''}">${escapeHtml(String(val))}</span>`;
                }

                const field = document.createElement('div');
                field.className = `flex flex-col md:flex-row md:items-start gap-1 md:gap-4 text-sm p-1 rounded-lg ${highlightClass}`;
                field.innerHTML = `
                  <span class="w-32 shrink-0 font-mono text-xs text-[#C4A77D] font-medium truncate">${key}:</span>
                  ${valHtml}
                `;
                fieldsCont.appendChild(field);
              });

              card.appendChild(fieldsCont);
              container.appendChild(card);
            }
          });
        });

        if (foundCount > 0) {
          bodyEl.appendChild(container);
          updateStatus(`Búsqueda completada. Se encontraron ${foundCount} coincidencias en la DB.`, "emerald");
        } else {
          bodyEl.innerHTML = '<div class="text-center text-neutral-500 py-10">No se encontraron coincidencias en la base de datos.</div>';
        }
      }
    }

    // COPIAR CONTENIDO DEL VISOR
    function copyViewerContent() {
      const bodyEl = document.getElementById('viewer-body');
      if (!bodyEl) return;
      
      const text = bodyEl.innerText;
      navigator.clipboard.writeText(text).then(() => {
        alert("¡Contenido copiado al portapapeles!");
      }).catch(err => {
        alert("Error al copiar: " + err.message);
      });
    }

    function escapeHtml(text) {
      return text.replace(/&/g, "&amp;").replace(/</g, "&lt;").replace(/>/g, "&gt;");
    }
  </script>
</body>
</html>
